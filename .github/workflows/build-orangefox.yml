name: Build OrangeFox VendorBoot (beryl)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📦 Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git-core gnupg flex bison build-essential zip curl zlib1g-dev \
          libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev \
          libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig repo ccache

    - name: 💾 Setup extra swap (safe for GitHub Actions)
      run: |
        sudo fallocate -l 10G /swapfile2
        sudo chmod 600 /swapfile2
        sudo mkswap /swapfile2
        sudo swapon /swapfile2 || true
        free -h

    - name: 🔄 Sync OrangeFox source
      run: |
        mkdir -p ~/fox
        cd ~/fox
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch 14.1 --path ~/fox_14.1

    - name: 📱 Clone device tree (beryl)
      run: |
        cd ~/fox_14.1
        git clone https://github.com/IQ-HARRY7/android_device_xiaomi_beryl.git device/xiaomi/beryl

    - name: 🧠 Patch BoardConfig (fix header version safely)
      run: |
        FILE=~/fox_14.1/device/xiaomi/beryl/BoardConfig.mk
        grep -q "BOARD_BOOT_HEADER_VERSION" $FILE || \
        echo "BOARD_BOOT_HEADER_VERSION := 4" >> $FILE

    - name: ⚙️ Setup build environment
      run: |
        cd ~/fox_14.1
        source build/envsetup.sh
        lunch omni_beryl-ap2a-eng

    - name: ⚡ Anti-OOM tuning
      run: |
        export NINJA_ARGS="-j2"
        export LLVM_PARALLEL_LINK_JOBS=1

    - name: 🏗️ Build vendorbootimage
      run: |
        cd ~/fox_14.1
        mka vendorbootimage -j2

    - name: 📤 Upload vendorboot image
      uses: actions/upload-artifact@v4
      with:
        name: vendorboot-beryl
        path: ~/fox_14.1/out/target/product/beryl/vendor_boot.img
